services:
  - type: web
    name: graphsentinel
    runtime: docker
    plan: free
    envVars:
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: GRAPH_NAME
        value: graphsentinel
